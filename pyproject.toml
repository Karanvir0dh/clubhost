[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clubhost"
version = "0.1.0"
description = "A student-club application deployment portal"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2.13.1,<3", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["clubhost*"]

[tool.setuptools.package-data]
clubhost = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
# Keep generated application and test data out of source checks.
extend-exclude = [".data", ".test-runs"]
