services:
  portal:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - clubhost-data:/data
    environment:
      CLUBHOST_MODE: simulator
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
volumes:
  clubhost-data:
